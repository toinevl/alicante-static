<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alicante Trip Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body class="p-8 md:p-16 bg-slate-50">

    <div class="max-w-6xl mx-auto">
        <header class="mb-12">
            <h1 class="text-4xl font-800 text-slate-900 tracking-tight text-center md:text-left">Alicante Trip Hub</h1>
            <p id="status-text" class="text-slate-500 mt-2 italic text-lg text-center md:text-left">Opening your itineraries...</p>
        </header>

        <div id="file-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Cards will appear here -->
        </div>

        <!-- Debugging section (can be removed once working) -->
        <div class="mt-20 p-6 bg-white rounded-2xl border border-slate-200 shadow-sm opacity-50">
            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Folder Scanner</h3>
            <p id="debug-path" class="text-[10px] font-mono text-slate-500 mb-2"></p>
            <ul id="debug-file-list" class="text-[10px] font-mono text-slate-400 space-y-1"></ul>
        </div>
    </div>

<script>
    // --- 1. CONFIGURATION ---
    const CONFIG = {
        username: 'YOUR_GITHUB_USERNAME', 
        repo: 'YOUR_REPO_NAME',
        folder: 'src' // We are now looking inside your 'src' folder
    };

    async function scanRepository() {
        const grid = document.getElementById('file-grid');
        const debugList = document.getElementById('debug-file-list');
        const statusText = document.getElementById('status-text');
        const pathText = document.getElementById('debug-path');

        const apiUrl = `https://api.github.com/repos/${CONFIG.username}/${CONFIG.repo}/contents/${CONFIG.folder}`;
        pathText.innerText = `Searching in: /${CONFIG.folder}`;

        try {
            const response = await fetch(apiUrl);
            
            if (!response.ok) {
                statusText.innerText = `Error: Folder '/${CONFIG.folder}' not found.`;
                return;
            }

            const files = await response.json();
            debugList.innerHTML = ''; 

            // Filter for HTML files
            const htmlFiles = files.filter(f => f.name.toLowerCase().endsWith('.html'));

            if (htmlFiles.length === 0) {
                statusText.innerText = `No .html files found in /${CONFIG.folder}`;
                files.forEach(f => debugList.innerHTML += `<li>📁 ${f.name}</li>`);
            } else {
                statusText.innerText = `Found ${htmlFiles.length} itineraries in /${CONFIG.folder}`;
                renderCards(htmlFiles);
            }

        } catch (e) {
            statusText.innerText = "Connection failed.";
            console.error(e);
        }
    }

    function renderCards(files) {
        const grid = document.getElementById('file-grid');
        const images = [
            "photo-1570530752494-0a30b5015a97",
            "photo-1523544545175-92e04b96dcef",
            "photo-1544971587-b842c27f8e14",
            "photo-1555881400-74d7acaacd8b"
        ];

        files.forEach((file, i) => {
            const friendlyName = file.name.replace('.html', '').replace(/_/g, ' ').replace(/-/g, ' ');
            
            // IMPORTANT: Since the files are in 'src/', the link must include 'src/'
            const filePath = `${CONFIG.folder}/${file.name}`;

            const card = document.createElement('div');
            card.className = 'bg-white rounded-3xl overflow-hidden shadow-sm border border-slate-100 hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1';
            card.innerHTML = `
                <div class="h-40 bg-slate-200">
                    <img src="https://images.unsplash.com/${images[i % images.length]}?w=600&q=80" class="w-full h-full object-cover">
                </div>
                <div class="p-6">
                    <h2 class="text-xl font-bold text-slate-900 capitalize mb-1">${friendlyName}</h2>
                    <p class="text-slate-400 text-[10px] mb-4 uppercase tracking-widest font-bold">Costa Blanca Route</p>
                    <a href="${filePath}" class="block w-full bg-slate-900 text-white text-center py-3 rounded-xl font-bold text-sm hover:bg-blue-600 transition shadow-lg shadow-slate-200">View 3D Map</a>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    scanRepository();
</script>
</body>
</html>
