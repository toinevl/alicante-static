<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alicante Trip Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .hub-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .hub-card:hover { transform: translateY(-5px); shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1); }
    </style>
</head>
<body class="p-8 md:p-16">

    <div class="max-w-6xl mx-auto">
        <header class="mb-12">
            <h1 class="text-4xl font-800 text-slate-900 tracking-tight">Alicante Trip Hub</h1>
            <p class="text-slate-500 mt-2 italic text-lg">Select an itinerary to begin your journey.</p>
        </header>

        <!-- Grid for Itineraries -->
        <div id="file-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Dynamic cards will appear here -->
        </div>

        <!-- Loading State -->
        <div id="loader" class="flex flex-col items-center justify-center py-20">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
            <p class="mt-4 text-slate-400 font-medium">Scanning Repository...</p>
        </div>
    </div>

<script>
    // --- CONFIGURATION ---
    const CONFIG = {
        username: 'YOUR_GITHUB_USERNAME', // Change this!
        repo: 'YOUR_REPO_NAME',           // Change this!
        branch: 'main'
    };

    async function fetchFiles() {
        const grid = document.getElementById('file-grid');
        const loader = document.getElementById('loader');

        try {
            // Fetch file list from GitHub API
            const response = await fetch(`https://api.github.com/repos/${CONFIG.username}/${CONFIG.repo}/contents/`);
            const files = await response.json();

            // Filter for HTML files, excluding index.html
            const htmlFiles = files.filter(file => 
                file.name.endsWith('.html') && 
                file.name !== 'index.html'
            );

            loader.style.display = 'none';

            htmlFiles.forEach(file => {
                const card = document.createElement('div');
                card.className = 'hub-card bg-white rounded-3xl overflow-hidden shadow-sm border border-slate-100 flex flex-col';
                
                // Friendly Name logic: Replace underscores with spaces and capitalize
                const friendlyName = file.name
                    .replace('.html', '')
                    .replace(/_/g, ' ')
                    .replace(/-/g, ' ');

                // Generate a consistent "Thumbnail" based on the filename
                const thumbCategory = file.name.toLowerCase().includes('south') ? 'coast' : 
                                    file.name.toLowerCase().includes('dynamic') ? 'tech' : 'mountain';
                const thumbUrl = `https://images.unsplash.com/photo-1505761671935-60b3a7427bad?w=600&q=80&sig=${file.name.length}`;

                card.innerHTML = `
                    <div class="h-48 overflow-hidden bg-slate-200">
                        <img src="${thumbUrl}" class="w-full h-full object-cover opacity-90">
                    </div>
                    <div class="p-6 flex-grow flex flex-col">
                        <h2 class="text-xl font-800 text-slate-900 capitalize mb-2">${friendlyName}</h2>
                        <p class="text-slate-500 text-sm mb-6 flex-grow">Interactive 3D map itinerary stored in ${file.name}.</p>
                        <a href="${file.name}" class="inline-block bg-slate-900 text-white text-center py-3 rounded-xl font-bold text-sm hover:bg-blue-600 transition">
                            Launch Itinerary
                        </a>
                    </div>
                `;
                grid.appendChild(card);
            });

        } catch (error) {
            loader.innerHTML = `<p class="text-red-500 font-bold text-center">Error loading repository. Check your CONFIG settings.</p>`;
            console.error(error);
        }
    }

    fetchFiles();
</script>
</body>
</html>
