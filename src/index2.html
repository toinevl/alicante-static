<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alicante Trip Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body class="p-8 md:p-16 bg-slate-50">

    <div class="max-w-6xl mx-auto">
        <header class="mb-12">
            <h1 class="text-4xl font-800 text-slate-900 tracking-tight">Alicante Trip Hub</h1>
            <p id="status-text" class="text-slate-500 mt-2 italic text-lg">Scanning for your itineraries...</p>
        </header>

        <div id="file-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Cards will appear here -->
        </div>

        <!-- Visibility Scanner (Helpful Debugging) -->
        <div class="mt-20 p-6 bg-white rounded-2xl border border-slate-200 shadow-sm">
            <h3 class="text-sm font-bold text-slate-400 uppercase tracking-widest mb-4">Repository Scanner (Debug)</h3>
            <ul id="debug-file-list" class="text-xs font-mono text-slate-600 space-y-1">
                <li>Scanning...</li>
            </ul>
        </div>
    </div>

<script>
    // --- 1. CONFIGURATION ---
    const CONFIG = {
        username: 'toinevl', 
        repo: 'alicante-static'
    };

    async function scanRepository() {
        const grid = document.getElementById('file-grid');
        const debugList = document.getElementById('debug-file-list');
        const statusText = document.getElementById('status-text');

        try {
            const url = `https://api.github.com/repos/${CONFIG.username}/${CONFIG.repo}/contents/`;
            const response = await fetch(url);
            
            if (!response.ok) {
                statusText.innerText = "Error: Could not access GitHub.";
                debugList.innerHTML = `<li>❌ API Error: ${response.status}</li><li>Make sure the repo is PUBLIC.</li>`;
                return;
            }

            const files = await response.json();
            debugList.innerHTML = ''; // Clear scanning text

            // Filter for HTML
            const htmlFiles = files.filter(f => f.name.toLowerCase().endsWith('.html') && f.name !== 'index.html');

            if (htmlFiles.length === 0) {
                statusText.innerText = "No itinerary files found.";
                debugList.innerHTML = `<li>Found ${files.length} total files, but zero .html files.</li>`;
                // List everything found so the user can see what the API sees
                files.forEach(f => {
                    debugList.innerHTML += `<li>📁 Found: ${f.name}</li>`;
                });
            } else {
                statusText.innerText = `Found ${htmlFiles.length} itineraries.`;
                renderCards(htmlFiles);
                htmlFiles.forEach(f => {
                    debugList.innerHTML += `<li>✅ Displaying: ${f.name}</li>`;
                });
            }

        } catch (e) {
            statusText.innerText = "Connection failed.";
            debugList.innerHTML = `<li>Error: ${e.message}</li>`;
        }
    }

    function renderCards(files) {
        const grid = document.getElementById('file-grid');
        const images = [
            "photo-1570530752494-0a30b5015a97",
            "photo-1523544545175-92e04b96dcef",
            "photo-1544971587-b842c27f8e14",
            "photo-1555881400-74d7acaacd8b"
        ];

        files.forEach((file, i) => {
            const friendlyName = file.name.replace('.html', '').replace(/_/g, ' ').replace(/-/g, ' ');
            const card = document.createElement('div');
            card.className = 'bg-white rounded-3xl overflow-hidden shadow-sm border border-slate-100 hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1';
            card.innerHTML = `
                <div class="h-40 bg-slate-200">
                    <img src="https://images.unsplash.com/${images[i % images.length]}?w=600&q=80" class="w-full h-full object-cover">
                </div>
                <div class="p-6">
                    <h2 class="text-xl font-bold text-slate-900 capitalize mb-1">${friendlyName}</h2>
                    <p class="text-slate-400 text-xs mb-4">Itinerary File: ${file.name}</p>
                    <a href="${file.name}" class="block w-full bg-blue-600 text-white text-center py-3 rounded-xl font-bold text-sm hover:bg-blue-700 transition">View Map</a>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    scanRepository();
</script>
</body>
</html>
