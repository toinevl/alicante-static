<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alicante Trip Hub - 3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body class="p-8 md:p-16 bg-slate-50">

    <div class="max-w-6xl mx-auto">
        <header class="mb-12">
            <h1 class="text-4xl font-800 text-slate-900 tracking-tight">Alicante Trip Hub</h1>
            <p id="status-text" class="text-slate-500 mt-2 italic text-lg text-center md:text-left">Finding your itineraries...</p>
        </header>

        <div id="file-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Cards will appear here -->
        </div>

        <!-- Debugging (Hidden by default, check console if issues persist) -->
        <div id="debug-info" class="hidden mt-20 p-4 border-t border-slate-200 text-[10px] font-mono text-slate-400"></div>
    </div>

<script>
    // --- 1. CONFIGURATION ---
    const CONFIG = {
        username: 'toinevl', 
        repo: 'alicante-static',
        githubFolder: 'src' // Where the files live on GitHub
    };

    async function scanRepository() {
        const grid = document.getElementById('file-grid');
        const statusText = document.getElementById('status-text');
        const debug = document.getElementById('debug-info');

        // We ask GitHub to look in the /src folder
        const apiUrl = `https://api.github.com/repos/${CONFIG.username}/${CONFIG.repo}/contents/${CONFIG.githubFolder}`;

        try {
            const response = await fetch(apiUrl);
            if (!response.ok) throw new Error("Folder not found");

            const files = await response.json();
            
            // Filter for HTML files
            const htmlFiles = files.filter(f => f.name.toLowerCase().endsWith('.html') && f.name !== 'index.html');

            if (htmlFiles.length === 0) {
                statusText.innerText = "No itineraries found in /src.";
            } else {
                statusText.innerText = `Ready to explore ${htmlFiles.length} routes.`;
                renderCards(htmlFiles);
            }

        } catch (e) {
            statusText.innerText = "Error connecting to the Hub.";
            console.error(e);
        }
    }

    function renderCards(files) {
        const grid = document.getElementById('file-grid');
        const images = [
            "photo-1570530752494-0a30b5015a97",
            "photo-1523544545175-92e04b96dcef",
            "photo-1544971587-b842c27f8e14",
            "photo-1555881400-74d7acaacd8b"
        ];

        files.forEach((file, i) => {
            // Friendly Name: "alicante_south.html" -> "Alicante South"
            const friendlyName = file.name.replace('.html', '').replace(/_/g, ' ').replace(/-/g, ' ');
            
            // URL LOGIC:
            // Since Azure flattens the site, we link to just "file.name" (at the root)
            const webPath = file.name;

            const card = document.createElement('div');
            card.className = 'bg-white rounded-3xl overflow-hidden shadow-sm border border-slate-100 hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1 flex flex-col';
            card.innerHTML = `
                <div class="h-44 bg-slate-200">
                    <img src="https://images.unsplash.com/${images[i % images.length]}?w=600&q=80" class="w-full h-full object-cover">
                </div>
                <div class="p-6 flex-grow flex flex-col">
                    <h2 class="text-xl font-bold text-slate-900 capitalize mb-1">${friendlyName}</h2>
                    <p class="text-slate-400 text-[11px] mb-6 uppercase font-bold tracking-widest">Costa Blanca Explorer</p>
                    <a href="${webPath}" class="mt-auto block w-full bg-slate-900 text-white text-center py-3 rounded-xl font-bold text-sm hover:bg-blue-600 transition shadow-lg shadow-slate-200">
                        Launch Map
                    </a>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    scanRepository();
</script>
</body>
</html>
